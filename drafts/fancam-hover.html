<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>시안 · 직캠 썸네일 호버 — 원희 팬사이트</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
<style>
  :root {
    --wall: #2a3038;
    --paper: #f6f1e5;
    --ink: #1f1e19;
    --body: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px 100px;
    background: var(--wall);
    color: var(--paper);
    font: 15px/1.7 var(--body);
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }
  button { font: inherit; color: inherit; }
  .intro { max-width: 1240px; margin: 0 auto 8px; }
  .intro h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
  .intro p { margin: 0; opacity: 0.72; }

  .option { max-width: 1240px; margin: 40px auto 0; }
  .option h2 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .option h2 b { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 50%; background: var(--paper); color: var(--ink); font-size: 13px; }
  .option h2 em { margin-left: 6px; font-size: 12px; font-style: normal; font-weight: 500; opacity: 0.55; }
  .option > p { margin: 0 0 14px; max-width: 820px; font-size: 14px; opacity: 0.75; }

  /* 실제 직캠 모달과 같은 바탕 · 그리드 · 썸네일 */
  .panel { padding: 28px 32px 32px; border-radius: 14px; background: rgba(8, 10, 14, 0.94); }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px 16px; margin: 0; padding: 0; list-style: none; }
  .tile { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
  .tile:focus-visible { outline: none; }
  .thumb { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 6px; background: rgba(246, 241, 229, 0.06); overflow: hidden; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .length { position: absolute; z-index: 2; right: 8px; bottom: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(0, 0, 0, 0.72); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.4; }
  .song { display: block; margin-top: 10px; font-size: 15px; font-weight: 600; line-height: 1.4; }
  .meta { display: block; font-size: 13px; line-height: 1.5; opacity: 0.56; }

  /* ── 0. 지금: 살짝 확대 + 흐려짐 ── */
  .o0 .thumb img { transition: opacity 0.3s ease, transform 0.4s ease; }
  .o0 .tile:is(:hover, :focus-visible) .thumb img { opacity: 0.86; transform: scale(1.03); }

  /* ── 1. 재생 버튼이 떠오름 ── */
  .o1 .thumb::after { content: ""; position: absolute; inset: 0; background: rgba(8, 10, 14, 0.42); opacity: 0; transition: opacity 0.2s ease; }
  .o1 .play {
    position: absolute; z-index: 1; top: 50%; left: 50%; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%;
    background: var(--paper); color: var(--ink); opacity: 0; transform: translate(-50%, calc(-50% + 6px)); transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .o1 .play svg { width: 18px; height: 18px; margin-left: 3px; fill: currentColor; }
  .o1 .tile:is(:hover, :focus-visible) .thumb::after { opacity: 1; }
  .o1 .tile:is(:hover, :focus-visible) .play { opacity: 1; transform: translate(-50%, -50%); }

  /* ── 2. 테두리가 생김 ── */
  .o2 .thumb { outline: 2px solid transparent; outline-offset: 3px; transition: outline-color 0.18s ease; }
  .o2 .song, .o2 .meta { transition: opacity 0.18s ease; }
  .o2 .tile:is(:hover, :focus-visible) .thumb { outline-color: var(--paper); }
  .o2 .tile:is(:hover, :focus-visible) .meta { opacity: 0.86; }

  /* ── 3. 나머지가 어두워짐 (고른 것만 남김) ── */
  .o3 .tile { transition: opacity 0.25s ease; }
  .o3 .grid:is(:hover, :has(.tile:focus-visible)) .tile:not(:hover, :focus-visible) { opacity: 0.32; }

  /* ── 4. 아래에 재생 막대가 차오름 ── */
  .o4 .thumb::before {
    content: ""; position: absolute; z-index: 1; left: 0; bottom: 0; width: 100%; height: 3px; background: var(--paper);
    transform: scaleX(0); transform-origin: left; transition: transform 0.45s cubic-bezier(0.3, 0.1, 0.3, 1);
  }
  .length .on { display: none; }
  .o4 .tile:is(:hover, :focus-visible) .thumb::before { transform: scaleX(1); }
  .o4 .tile:is(:hover, :focus-visible) .length { background: var(--paper); color: var(--ink); }
  .o4 .tile:is(:hover, :focus-visible) .length .off { display: none; }
  .o4 .tile:is(:hover, :focus-visible) .length .on { display: inline; }

  /* ── 5. 살짝 떠오름 + 그림자 ── */
  .o5 .tile { transition: transform 0.22s ease; }
  .o5 .thumb { transition: box-shadow 0.22s ease; }
  .o5 .tile:is(:hover, :focus-visible) { transform: translateY(-6px); }
  .o5 .tile:is(:hover, :focus-visible) .thumb { box-shadow: 0 14px 28px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(246, 241, 229, 0.18); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>

<header class="intro">
  <h1>직캠 썸네일 호버 — 확대 말고 다른 것</h1>
  <p>실제 직캠 모달과 같은 바탕 · 크기 · 유튜브 썸네일입니다. 썸네일에 마우스를 올려 보세요. 키보드 Tab으로 옮겨 가도 같은 효과가 나옵니다. 0번은 지금 쓰는 것(비교용)입니다.</p>
</header>

<div id="options"></div>

<script>
  const FANCAMS = [
    { id: "79eFsTF2ETQ", song: "체포하겠어", show: "쇼! 음악중심", date: "2026.11.07", length: "3:23" },
    { id: "3grDu2wJjGQ", song: "I Got Your Back", show: "M2", date: "2026.08.22", length: "2:48" },
    { id: "GAOf0eWlbSM", song: "It’s Me", show: "엠카운트다운", date: "2026.05.28", length: "2:53" },
    { id: "xiewqAymd34", song: "NOT CUTE ANYMORE", show: "쇼! 음악중심", date: "2025.12.06", length: "3:07" },
  ];
  const PLAY = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z" /></svg>`;
  const OPTIONS = [
    { name: "살짝 확대 + 흐려짐", note: "지금 쓰는 것", desc: "비교용." },
    { name: "재생 버튼이 떠오름", desc: "썸네일이 살짝 어두워지고 가운데에 MV 버튼과 같은 크림색 재생 버튼이 떠오릅니다. \"누르면 재생된다\"가 가장 분명합니다." },
    { name: "테두리가 생김", desc: "썸네일 둘레에 크림색 테두리가 생기고 날짜 글자가 진해집니다. 움직임이 전혀 없어 가장 차분하고, 키보드 포커스 표시와도 같은 모양입니다." },
    { name: "나머지가 어두워짐", desc: "고른 썸네일만 그대로 두고 나머지가 어둡게 가라앉습니다. 썸네일 자체는 건드리지 않아 사진이 그대로 보입니다." },
    { name: "아래에 재생 막대가 차오름", desc: "썸네일 아래쪽에 얇은 재생 막대가 왼쪽부터 차오르고, 길이 표시가 \"▶ 재생\"으로 바뀝니다. 영상이라는 느낌이 가장 강합니다." },
    { name: "살짝 떠오름 + 그림자", desc: "카드가 위로 6px 뜨면서 아래에 그림자가 생깁니다. 크기는 그대로라 확대처럼 보이지 않습니다." },
  ];

  document.getElementById("options").innerHTML = OPTIONS.map((o, i) => `
    <section class="option o${i}">
      <h2><b>${i}</b>${o.name}${o.note ? `<em>${o.note}</em>` : ""}</h2>
      <p>${o.desc}</p>
      <div class="panel">
        <ul class="grid">${FANCAMS.map((f) => `
          <li>
            <button class="tile" type="button">
              <span class="thumb">
                <img src="https://i.ytimg.com/vi/${f.id}/hqdefault.jpg" alt="" referrerpolicy="no-referrer" />
                ${i === 1 ? `<span class="play">${PLAY}</span>` : ""}
                <span class="length"><span class="off">${f.length}</span><span class="on">▶ 재생</span></span>
              </span>
              <strong class="song">${f.song}</strong>
              <small class="meta">${f.show} · ${f.date}</small>
            </button>
          </li>`).join("")}
        </ul>
      </div>
    </section>`).join("");
</script>
</body>
</html>
