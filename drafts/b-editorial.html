<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>시안 B · 에디토리얼 — 원희 팬사이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
<style>
  :root {
    --wall: #7d97aa;
    --paper: #f6f1e5;
    --ink: #1f1e19;
    --serif-ko: "Gowun Batang", "Fraunces", serif;
    --body: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --gutter: clamp(20px, 5vw, 80px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--paper);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }
  figure { margin: 0; }
  :focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }

  /* 한 화면: 사진이 화면 전체를 채우고, 그 위에 사인과 한 줄 소개만 얹는다 */
  .page {
    position: relative;
    height: 100svh;
    min-height: 480px;
    overflow: hidden;
    background: var(--wall);
  }

  /* 사진 */
  .stage { position: absolute; inset: 0; touch-action: pan-y; }
  .slides { position: absolute; inset: 0; display: grid; }
  .slide {
    grid-area: 1 / 1;
    display: flex;
    min-width: 0;
    min-height: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0s 0.8s;
  }
  .slide.is-active { opacity: 1; visibility: visible; transition-delay: 0s; }
  .slide figure { flex: 1 1 0; min-width: 0; min-height: 0; }
  .slide img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; }
  /* 글자가 놓이는 왼쪽 아래만 살짝 어둡게 */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(12, 16, 22, 0.62) 0%, rgba(12, 16, 22, 0.26) 26%, transparent 52%),
      radial-gradient(90% 70% at 0% 100%, rgba(12, 16, 22, 0.42) 0%, transparent 70%);
    pointer-events: none;
  }

  /* 넘기는 버튼 */
  .arrow {
    position: absolute;
    z-index: 3;
    top: 50%;
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(12, 16, 22, 0.38);
    color: var(--paper);
    cursor: pointer;
    transform: translateY(-50%);
    transition: background-color 0.18s ease;
  }
  .arrow:hover { background: rgba(12, 16, 22, 0.62); }
  .arrow svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .prev { left: clamp(10px, 1.6vw, 26px); }
  .next { right: clamp(10px, 1.6vw, 26px); }

  /* 사인 */
  .mast {
    position: absolute;
    z-index: 2;
    left: var(--gutter);
    bottom: clamp(36px, 7svh, 76px);
    pointer-events: none;
  }
  .mast h1 {
    margin: 0;
    width: min(32vw, 52svh, 480px);
    color: var(--paper);
    filter: drop-shadow(0 2px 10px rgba(10, 14, 20, 0.45));
  }
  /* 사인: 긴 사선을 내려 그은 뒤, 그 끝에서 hee와 끝 장식까지 한 붓으로 이어 그린다 */
  .sign svg { display: block; width: 100%; height: auto; overflow: visible; }
  .sign path {
    fill: none;
    stroke: currentColor;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1 1.2;
    animation: sign-write var(--dur) var(--ease) var(--delay) both;
  }
  .sign .s1 { --from: 1.04; --dur: 0.32s; --delay: 0.35s; --ease: cubic-bezier(0.5, 0, 0.6, 1); }
  .sign .s2 { --from: 1.01; --dur: 2.1s; --delay: 0.67s; --ease: cubic-bezier(0.3, 0.1, 0.5, 1); }
  @keyframes sign-write {
    from { stroke-dashoffset: var(--from); }
    to { stroke-dashoffset: 0; }
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .mast p {
    margin: 1.1em 0 0 0.3em;
    max-width: 22em;
    font: 400 clamp(17px, 1.5vw, 22px) / 1.5 var(--serif-ko);
    text-shadow: 0 1px 10px rgba(10, 14, 20, 0.6);
  }

  /* 시안 전환 */
  .drafts {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px 6px 16px;
    border-radius: 999px;
    background: rgba(18, 18, 22, 0.86);
    color: #fff;
    font: 600 14px / 1 -apple-system, "Apple SD Gothic Neo", sans-serif;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }
  .drafts span { margin-right: 6px; opacity: 0.7; }
  .drafts a { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; text-decoration: none; color: #fff; }
  .drafts a:hover { background: rgba(255, 255, 255, 0.16); }
  .drafts a[aria-current] { background: #fff; color: #121216; }

  @media (max-width: 820px) {
    body { font-size: 16px; }
    /* 세로 화면에서는 세 장을 위아래로 쌓는다 */
    .slide.three { flex-direction: column; }
    .slide img { object-position: 50% 24%; }
    .arrow { width: 44px; height: 44px; }
    .mast { left: 16px; bottom: 28px; }
    .mast h1 { width: 50vw; }
    .mast p { margin-top: 0.8em; max-width: 15em; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sign path { animation: none; }
    .slide, .arrow { transition: none; }
  }
</style>
</head>

<script>
(() => {
  const INTERVAL_MS = 5000;
  const SWIPE_PX = 40;
  const stage = document.getElementById('stage');
  const live = document.getElementById('slides');
  const slides = Array.from(live.children);
  const arrows = [document.getElementById('prev'), document.getElementById('next')];
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let index = 0;
  let timer = null;
  let held = false; // 버튼에 마우스를 올렸거나 키보드로 들어와 있는 동안
  let dragFrom = null;

  const show = (next) => {
    index = (next + slides.length) % slides.length;
    slides.forEach((slide, i) => {
      slide.classList.toggle('is-active', i === index);
      slide.setAttribute('aria-hidden', String(i !== index));
    });
  };

  const schedule = () => {
    window.clearTimeout(timer);
    if (still || held || document.hidden) return;
    timer = window.setTimeout(() => {
      show(index + 1);
      schedule();
    }, INTERVAL_MS);
  };

  const step = (delta) => {
    show(index + delta);
    schedule();
  };

  const hold = (value) => {
    held = value;
    live.setAttribute('aria-live', value ? 'polite' : 'off');
    schedule();
  };

  arrows.forEach((arrow, i) => {
    arrow.addEventListener('click', () => step(i === 0 ? -1 : 1));
    arrow.addEventListener('mouseenter', () => hold(true));
    arrow.addEventListener('mouseleave', () => hold(false));
    arrow.addEventListener('focus', () => {
      if (arrow.matches(':focus-visible')) hold(true);
    });
    arrow.addEventListener('blur', () => hold(false));
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft') step(-1);
    if (event.key === 'ArrowRight') step(1);
  });

  stage.addEventListener('pointerdown', (event) => {
    dragFrom = event.pointerType === 'mouse' ? null : event.clientX;
  });
  stage.addEventListener('pointerup', (event) => {
    if (dragFrom === null) return;
    const moved = event.clientX - dragFrom;
    dragFrom = null;
    if (Math.abs(moved) >= SWIPE_PX) step(moved < 0 ? 1 : -1);
  });
  stage.addEventListener('pointercancel', () => {
    dragFrom = null;
  });

  document.addEventListener('visibilitychange', schedule);

  schedule();
})();
</script>
