<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>시안 · 신곡 MV 배치 — 원희 팬사이트</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
<style>
  :root {
    --wall: #7d97aa;
    --paper: #f6f1e5;
    --ink: #1f1e19;
    --night: #0c1016;
    --body: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --gutter: clamp(20px, 5vw, 80px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--paper);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }
  figure { margin: 0; }
  button { font: inherit; }
  :focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }

  /* ── 시안 전환용 (실제 사이트에는 없음) ── */
  .draft-bar {
    position: fixed; z-index: 100; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 4px;
    border-radius: 999px; background: rgba(12, 16, 22, 0.78); backdrop-filter: blur(8px);
    font-size: 13px;
  }
  .draft-bar button {
    padding: 7px 14px; border: 0; border-radius: 999px;
    background: transparent; color: rgba(246, 241, 229, 0.7); cursor: pointer;
  }
  .draft-bar button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; }
  .draft-note {
    position: fixed; z-index: 100; top: 58px; left: 50%; transform: translateX(-50%);
    max-width: min(560px, 92vw); padding: 8px 14px; border-radius: 10px;
    background: rgba(12, 16, 22, 0.66); font-size: 13px; line-height: 1.5; text-align: center;
  }

  /* ── 메인 첫 화면 (현재 사이트와 동일) ── */
  .hero { position: relative; height: 100svh; min-height: 480px; overflow: hidden; }
  .slides { position: absolute; inset: 0; display: grid; }
  .slide {
    grid-area: 1 / 1; display: flex; min-width: 0; min-height: 0;
    opacity: 0; visibility: hidden; transition: opacity 0.8s ease, visibility 0s 0.8s;
  }
  .slide.is-active { opacity: 1; visibility: visible; transition-delay: 0s; }
  .slide figure { flex: 1 1 0; min-width: 0; min-height: 0; position: relative; }
  .slide img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; }
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to top, rgba(12, 16, 22, 0.62) 0%, rgba(12, 16, 22, 0.26) 26%, transparent 52%),
      radial-gradient(90% 70% at 0% 100%, rgba(12, 16, 22, 0.42) 0%, transparent 70%);
  }
  .arrow {
    position: absolute; z-index: 3; top: 50%; transform: translateY(-50%);
    display: grid; place-items: center; width: 52px; height: 52px; padding: 0;
    border: 0; border-radius: 50%; background: rgba(12, 16, 22, 0.38); color: var(--paper); cursor: pointer;
  }
  .arrow:hover { background: rgba(12, 16, 22, 0.62); }
  .arrow svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .prev { left: clamp(10px, 1.6vw, 26px); }
  .next { right: clamp(10px, 1.6vw, 26px); }
  .mast { position: absolute; z-index: 2; left: var(--gutter); bottom: clamp(36px, 7svh, 76px); pointer-events: none; }
  .mast .sign { margin: 0; font: 600 clamp(56px, 9vw, 120px) / 1 var(--body); letter-spacing: -0.03em; }
  .mast p { margin: 0.8em 0 0 0.3em; font-size: clamp(17px, 1.5vw, 22px); text-shadow: 0 1px 10px rgba(10, 14, 20, 0.6); }

  /* ── 공통: 재생 버튼 · 플레이어 ── */
  .play-disc {
    display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%;
    background: var(--paper); color: var(--ink); flex: none;
  }
  .play-disc svg { width: 24px; height: 24px; margin-left: 4px; fill: currentColor; }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .player img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player-cover {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 0; border: 0; background: rgba(12, 16, 22, 0.18); cursor: pointer; color: inherit;
  }
  .player-cover:hover { background: rgba(12, 16, 22, 0.32); }
  .player-cover .play-disc { width: 84px; height: 84px; }
  .player-cover .play-disc svg { width: 30px; height: 30px; }

  /* ── A: 첫 화면 오른쪽 아래 버튼 → 전체 화면 플레이어 ── */
  .np {
    position: absolute; z-index: 3; right: var(--gutter); bottom: clamp(36px, 7svh, 76px);
    display: flex; align-items: center; gap: 14px;
    padding: 8px 22px 8px 8px; border: 0; border-radius: 999px;
    background: rgba(12, 16, 22, 0.5); backdrop-filter: blur(10px);
    color: var(--paper); text-align: left; cursor: pointer;
    transition: background-color 0.18s ease;
  }
  .np:hover { background: rgba(12, 16, 22, 0.72); }
  .np .play-disc { width: 48px; height: 48px; }
  .np .play-disc svg { width: 18px; height: 18px; margin-left: 3px; }
  .np small { display: block; font-size: 12px; letter-spacing: 0.12em; opacity: 0.72; }
  .np strong { display: block; font-size: 17px; font-weight: 600; }
  .sheet {
    position: fixed; z-index: 50; inset: 0; display: grid; place-items: center;
    --pad: clamp(16px, 5vw, 80px); padding: var(--pad); background: rgba(8, 10, 14, 0.92);
  }
  .sheet[hidden] { display: none; }
  .sheet-title { margin: 0 0 14px; font-size: clamp(18px, 2vw, 24px); line-height: 1.4; font-weight: 600; }
  .sheet .close { position: absolute; top: clamp(12px, 2vw, 28px); right: clamp(12px, 2vw, 28px); }
  .sheet-head small { display: block; font-size: 12px; letter-spacing: 0.12em; opacity: 0.6; font-weight: 400; }
  .close {
    width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
    background: rgba(246, 241, 229, 0.12); color: var(--paper); cursor: pointer; font-size: 22px; line-height: 1;
  }
  .close:hover { background: rgba(246, 241, 229, 0.24); }

  /* ── B: 슬라이드 맨 앞에 MV ── */
  .slide.mv figure { background: #000; }
  .slide.mv .mv-cover {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 0; border: 0;
    background: rgba(12, 16, 22, 0.2); color: inherit; cursor: pointer;
  }
  .slide.mv .mv-cover .play-disc { width: 92px; height: 92px; }
  .slide.mv .mv-cover .play-disc svg { width: 32px; height: 32px; }
  .slide.mv .mv-label {
    position: absolute; z-index: 2; top: clamp(70px, 12svh, 120px); left: var(--gutter);
    font-size: 13px; letter-spacing: 0.14em; text-shadow: 0 1px 8px rgba(10, 14, 20, 0.6);
  }
  .slide.mv .mv-label strong { display: block; margin-top: 4px; font-size: clamp(22px, 2.6vw, 34px); letter-spacing: 0; font-weight: 600; }
  .slide.mv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 4; }
  .hero.is-playing .mast, .hero.is-playing::after { opacity: 0; transition: opacity 0.3s; }
  .dots { position: absolute; z-index: 3; right: var(--gutter); bottom: clamp(36px, 7svh, 76px); display: flex; gap: 8px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(246, 241, 229, 0.4); }
  .dots span.on { background: var(--paper); }
  .dots span.mv-dot { width: 22px; border-radius: 4px; }

  /* ── C: 아래로 내리면 두 번째 화면 ── */
  .scroll-hint {
    position: absolute; z-index: 3; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--paper); text-decoration: none; font-size: 13px; letter-spacing: 0.08em;
    text-shadow: 0 1px 8px rgba(10, 14, 20, 0.6);
  }
  .scroll-hint svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(4px); } }
  .screen2 {
    min-height: 100svh; display: grid; align-content: center; gap: clamp(20px, 3svh, 32px);
    padding: clamp(48px, 8svh, 96px) var(--gutter); background: var(--night);
  }
  .screen2 header { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
  .screen2 small { font-size: 13px; letter-spacing: 0.14em; opacity: 0.6; }
  .screen2 h2 { margin: 6px 0 0; font-size: clamp(30px, 4.4vw, 60px); line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; }
  .screen2 h2 span { display: block; font-size: 0.42em; font-weight: 400; opacity: 0.7; letter-spacing: 0; margin-top: 6px; }
  .screen2 .player { width: min(100%, calc((100svh - 260px) * 16 / 9)); justify-self: center; }
  .screen2 a.yt { color: var(--paper); font-size: 14px; opacity: 0.7; }
  .screen2 a.yt:hover { opacity: 1; }

  [data-only] { display: none !important; }
  body[data-v="a"] [data-only~="a"],
  body[data-v="b"] [data-only~="b"],
  body[data-v="c"] [data-only~="c"] { display: revert !important; }
  body[data-v="a"] .np[data-only], body[data-v="b"] .dots[data-only] { display: flex !important; }
  body[data-v="c"] .scroll-hint[data-only] { display: flex !important; }
  body[data-v="c"] .screen2[data-only] { display: grid !important; }
  body[data-v="b"] .slide.mv[data-only] { display: flex !important; }

  @media (max-width: 820px) {
    .slide.three { flex-direction: column; }
    .arrow { width: 44px; height: 44px; }
    .mast { left: 16px; bottom: 96px; }
    .np { right: 16px; left: 16px; bottom: 20px; }
    .dots { right: 16px; bottom: 28px; }
    .draft-note { top: auto; bottom: 90px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: none; }
    .scroll-hint svg { animation: none; }
  }
</style>
</head>
<body data-v="a">

<nav class="draft-bar" aria-label="시안 선택">
  <button type="button" data-pick="a" aria-pressed="true">A · 버튼 → 크게 보기</button>
  <button type="button" data-pick="b" aria-pressed="false">B · 슬라이드 첫 장</button>
  <button type="button" data-pick="c" aria-pressed="false">C · 두 번째 화면</button>
</nav>
<p class="draft-note" id="note"></p>

<main>
  <section class="hero" id="hero" aria-roledescription="캐러셀" aria-label="원희 사진">
    <div class="slides" id="slides">
      <!-- B 전용: MV 슬라이드 -->
      <div class="slide mv" data-only="b" data-mv>
        <figure>
          <img src="https://i.ytimg.com/vi/V2V9-9VhYJo/maxresdefault.jpg" alt="체포하겠어 뮤직비디오 썸네일" />
          <p class="mv-label">NEW · ILLIT<strong>체포하겠어</strong></p>
          <button type="button" class="mv-cover" data-play="slide" aria-label="체포하겠어 뮤직비디오 재생">
            <span class="play-disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg></span>
          </button>
        </figure>
      </div>
      <div class="slide three">
        <figure><img src="../src/assets/photos/editorial-02.jpg" alt="노란 책을 안고 옆을 바라보는 원희" /></figure>
        <figure><img src="../src/assets/photos/editorial-03.jpg" alt="노란 상자와 열쇠를 든 원희" /></figure>
        <figure><img src="../src/assets/photos/editorial-07.jpg" alt="원희 얼굴 클로즈업" /></figure>
      </div>
      <div class="slide"><figure><img src="../src/assets/photos/editorial-05.jpg" alt="분홍색 책자를 펼쳐 든 원희" /></figure></div>
      <div class="slide"><figure><img src="../src/assets/photos/diner-04.jpg" alt="두 주먹을 들어 보이는 원희" /></figure></div>
      <div class="slide"><figure><img src="../src/assets/photos/diner-05.jpg" alt="네온 식당에서 국수를 먹는 원희" /></figure></div>
    </div>

    <button type="button" class="arrow prev" data-move="-1" aria-label="이전 사진"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg></button>
    <button type="button" class="arrow next" data-move="1" aria-label="다음 사진"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg></button>

    <header class="mast">
      <h1 class="sign">Wonhee</h1>
      <p>ILLIT · WONHEE · 2007.06.26</p>
    </header>

    <!-- A 전용 -->
    <button type="button" class="np" data-only="a" data-open-sheet>
      <span class="play-disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg></span>
      <span><small>NEW MV</small><strong>체포하겠어</strong></span>
    </button>

    <!-- B 전용 -->
    <div class="dots" data-only="b" aria-hidden="true" id="dots"></div>

    <!-- C 전용 -->
    <a class="scroll-hint" href="#mv" data-only="c">
      신곡 MV
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
    </a>
  </section>

  <!-- C 전용: 두 번째 화면 -->
  <section class="screen2" id="mv" data-only="c" aria-labelledby="mv-title">
    <header>
      <div>
        <small>NEW · MUSIC VIDEO</small>
        <h2 id="mv-title">체포하겠어<span>You're Under Arrest</span></h2>
      </div>
      <a class="yt" href="https://www.youtube.com/watch?v=V2V9-9VhYJo" target="_blank" rel="noopener">YouTube에서 보기 ↗</a>
    </header>
    <div class="player" data-player>
      <img src="https://i.ytimg.com/vi/V2V9-9VhYJo/maxresdefault.jpg" alt="체포하겠어 뮤직비디오 썸네일" loading="lazy" />
      <button type="button" class="player-cover" aria-label="체포하겠어 뮤직비디오 재생">
        <span class="play-disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg></span>
      </button>
    </div>
  </section>
</main>

<!-- A 전용: 전체 화면 플레이어 -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <button type="button" class="close" data-close-sheet aria-label="닫기">×</button>
  <div style="width:100%;display:grid;justify-items:center">
    <div style="width:min(100%, calc((100svh - 2 * var(--pad) - 48px) * 16 / 9))">
      <h2 id="sheet-title" class="sheet-title">체포하겠어 (You're Under Arrest)</h2>
      <div class="player" id="sheet-player"></div>
    </div>
  </div>
</div>

<script>
  const VIDEO_ID = 'V2V9-9VhYJo'
  const EMBED = `https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&rel=0&playsinline=1`
  const NOTES = {
    a: '첫 화면은 그대로 두고, 오른쪽 아래에 작은 버튼만 추가. 누르면 어두운 화면 위에 영상이 크게 뜬다.',
    b: '사진 슬라이드 맨 앞 장을 MV로. 재생하면 그 자리에서 전체 화면으로 재생되고 자동 넘김은 멈춘다.',
    c: '첫 화면 아래로 스크롤하면 두 번째 화면 전체가 MV. 지금은 한 화면짜리 사이트라 구조가 바뀐다.',
  }

  const makeIframe = () => {
    const f = document.createElement('iframe')
    f.src = EMBED
    f.title = '체포하겠어 뮤직비디오'
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'
    f.allowFullscreen = true
    return f
  }

  // 썸네일 고화질이 없으면 hq로 대체
  document.querySelectorAll('img[src*="maxresdefault"]').forEach((img) => {
    img.addEventListener('load', () => { if (img.naturalWidth <= 120) img.src = img.src.replace('maxresdefault', 'hqdefault') })
    img.addEventListener('error', () => { img.src = img.src.replace('maxresdefault', 'hqdefault') })
  })

  // 캐러셀
  const hero = document.getElementById('hero')
  const dots = document.getElementById('dots')
  let index = 0
  let playing = false
  let timer
  const visibleSlides = () => [...document.querySelectorAll('.slide')].filter((el) => getComputedStyle(el).display !== 'none')
  const render = () => {
    const slides = visibleSlides()
    slides.forEach((el, i) => el.classList.toggle('is-active', i === index))
    dots.innerHTML = slides.map((el, i) => `<span class="${i === index ? 'on' : ''} ${el.hasAttribute('data-mv') ? 'mv-dot' : ''}"></span>`).join('')
  }
  const move = (delta) => {
    stopSlideVideo()
    const n = visibleSlides().length
    index = (index + delta + n) % n
    render()
    schedule()
  }
  const schedule = () => {
    clearTimeout(timer)
    if (playing || matchMedia('(prefers-reduced-motion: reduce)').matches) return
    // B에서 MV 장은 조금 더 오래 머문다
    const onMv = visibleSlides()[index]?.hasAttribute('data-mv')
    timer = setTimeout(() => move(1), onMv ? 9000 : 5000)
  }
  document.querySelectorAll('[data-move]').forEach((b) => b.addEventListener('click', () => move(Number(b.dataset.move))))

  // B: 슬라이드 안에서 재생
  const stopSlideVideo = () => {
    document.querySelectorAll('.slide.mv iframe').forEach((f) => f.remove())
    playing = false
    hero.classList.remove('is-playing')
  }
  document.querySelector('[data-play="slide"]').addEventListener('click', (e) => {
    e.currentTarget.closest('figure').append(makeIframe())
    playing = true
    hero.classList.add('is-playing')
    clearTimeout(timer)
  })

  // A: 전체 화면 플레이어
  const sheet = document.getElementById('sheet')
  const sheetPlayer = document.getElementById('sheet-player')
  let lastFocus
  const openSheet = () => {
    lastFocus = document.activeElement
    sheetPlayer.replaceChildren(makeIframe())
    sheet.hidden = false
    playing = true
    clearTimeout(timer)
    sheet.querySelector('.close').focus()
  }
  const closeSheet = () => {
    sheet.hidden = true
    sheetPlayer.replaceChildren()
    playing = false
    schedule()
    lastFocus?.focus()
  }
  document.querySelector('[data-open-sheet]').addEventListener('click', openSheet)
  document.querySelector('[data-close-sheet]').addEventListener('click', closeSheet)
  sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet() })
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !sheet.hidden) closeSheet()
    if (!sheet.hidden) return
    if (e.key === 'ArrowLeft') move(-1)
    if (e.key === 'ArrowRight') move(1)
  })

  // C: 두 번째 화면 플레이어
  document.querySelectorAll('[data-player] .player-cover').forEach((btn) => {
    btn.addEventListener('click', () => btn.parentElement.append(makeIframe()))
  })

  // 시안 전환
  const pick = (v) => {
    document.body.dataset.v = v
    document.querySelectorAll('[data-pick]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pick === v)))
    document.getElementById('note').textContent = NOTES[v]
    if (!sheet.hidden) closeSheet()
    document.querySelectorAll('[data-player] iframe').forEach((f) => f.remove())
    stopSlideVideo()
    document.body.style.overflow = v === 'c' ? '' : 'hidden'
    window.scrollTo(0, 0)
    index = 0
    render()
    schedule()
    history.replaceState(null, '', `?v=${v}`)
  }
  document.querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => pick(b.dataset.pick)))
  pick(new URLSearchParams(location.search).get('v') || 'a')
</script>
</body>
</html>
